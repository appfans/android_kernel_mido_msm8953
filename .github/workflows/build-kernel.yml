name: Build Mido Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        repository: appfans/android_kernel_mido_msm8953
        ref: lineage-21
        path: kernel

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu

    - name: Download toolchain (AOSP Clang)
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
        echo "CLANG_PATH=${GITHUB_WORKSPACE}/clang/bin" >> $GITHUB_ENV
        echo "${GITHUB_WORKSPACE}/clang/bin" >> $GITHUB_PATH

    - name: Build kernel
      run: |
        cd kernel
        
        # 1. 修复 vDSO 头文件生成顺序
        sed -i '/^PHONY += vdso_install/,/^$/d' arch/arm64/Makefile
        sed -i '/^prepare: vdso_prepare/a vdso_prepare: prepare0\n\t$(Q)$(MAKE) $(build)=arch/arm64/kernel/vdso include/generated/vdso-offsets.h' arch/arm64/Makefile
        
        # 2. 替换 clang 目录下的 ld 符号链接为 ld.lld
        rm -f "${CLANG_PATH}/ld"
        ln -s "${CLANG_PATH}/ld.lld" "${CLANG_PATH}/ld"
        
        # 3. 生成默认配置
        make O=out ARCH=arm64 msm8953_defconfig
        
        # 4. 禁用不兼容的编译器选项
        scripts/config --file out/.config --disable CC_STACKPROTECTOR_STRONG
        
        # 5. 【关键修复】禁用有问题的摄像头驱动配置
        # 禁用 MSM_CAMERA 相关配置，跳过 dual_cam_drop 结构体报错
        scripts/config --file out/.config --disable CONFIG_MSM_CAMERA
        scripts/config --file out/.config --disable CONFIG_MSM_CAMERA_SENSOR
        scripts/config --file out/.config --disable CONFIG_MSM_CAMERA_FLASH
        
        # 6. 开始编译
        make -j$(nproc) O=out ARCH=arm64 \
          LLVM_IAS=1 \
          CC="${CLANG_PATH}/clang" \
          LD="${CLANG_PATH}/ld.lld" \
          AS="${CLANG_PATH}/llvm-as" \
          AR="${CLANG_PATH}/llvm-ar" \
          NM="${CLANG_PATH}/llvm-nm" \
          OBJCOPY="${CLANG_PATH}/llvm-objcopy" \
          OBJDUMP="${CLANG_PATH}/llvm-objdump" \
          READELF="${CLANG_PATH}/llvm-readelf" \
          STRIP="${CLANG_PATH}/llvm-strip" \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu-

    - name: Package with AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
        cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        cd AnyKernel3 && zip -r ../AnyKernel3-mido.zip . -x ".git/*"

    - name: Upload kernel artifact
      uses: actions/upload-artifact@v4
      with:
        name: AnyKernel3-mido
        path: AnyKernel3-mido.zip
