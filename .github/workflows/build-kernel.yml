name: Build Mido Kernel

on:
  workflow_dispatch: # 允许你手动点击按钮触发编译

jobs:
  build:
    runs-on: ubuntu-22.04 # 使用GitHub提供的Ubuntu环境

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        repository: appfans/android_kernel_mido_msm8953 # 你的仓库地址
        ref: lineage-21 # 内核分支名 lineage-21
        path: kernel

    - name: Install dependencies
      run: |
        sudo apt-get update
        # 【修复1】加上了 binutils-aarch64-linux-gnu，解决找不到 objdump 和 ld 的问题
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev binutils-aarch64-linux-gnu

    - name: Download toolchain (AOSP Clang)
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
        echo "CLANG_PATH=${GITHUB_WORKSPACE}/clang/bin" >> $GITHUB_ENV

    - name: Build kernel
      run: |
        cd kernel
        # 【修复2】加上了这两行 sed 命令，修复 vdso_offset_sigtramp 报错
        sed -i '/^PHONY += vdso_install/,/^$/d' arch/arm64/Makefile
        sed -i '/^prepare: vdso_prepare/a vdso_prepare: prepare0\n\t$(Q)$(MAKE) $(build)=arch/arm64/kernel/vdso include/generated/vdso-offsets.h' arch/arm64/Makefile
        
        # 请确认defconfig文件名 msm8953_defconfig
        make O=out ARCH=arm64 msm8953_defconfig
        
        # 【修复3】你刚才漏掉的就是这一行！禁用不兼容的编译器选项
        scripts/config --file out/.config --disable CC_STACKPROTECTOR_STRONG
        
        # 开始编译
        make -j$(nproc) O=out ARCH=arm64 \
          CC="${CLANG_PATH}/clang" \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: Package with AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
        # 将编译好的内核镜像复制到AnyKernel3模板中
        cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        cd AnyKernel3 && zip -r ../AnyKernel3-mido.zip . -x ".git/*"

    - name: Upload kernel artifact
      uses: actions/upload-artifact@v4
      with:
        name: AnyKernel3-mido
        path: AnyKernel3-mido.zip
